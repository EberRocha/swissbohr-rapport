<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swissbohr Rapport</title>
</head>
<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg: oklch(96% 0.006 240);
    --surface: oklch(99% 0.002 240);
    --surface-2: oklch(93% 0.009 240);
    --ink: oklch(22% 0.012 240);
    --muted: oklch(46% 0.02 240);
    --line: oklch(84% 0.011 240);
    --red: oklch(52% 0.19 26);
    --red-deep: oklch(40% 0.17 26);
    --red-ink: oklch(32% 0.15 26);
    --red-wash: oklch(93% 0.03 26);
    --ok: oklch(58% 0.13 150);
    --ok-wash: oklch(94% 0.04 150);
    --focus: oklch(60% 0.16 240);
    --radius: 7px;
    --shadow: 0 1px 2px oklch(20% 0 0 / 0.08), 0 3px 10px oklch(20% 0 0 / 0.07);
    --font-display: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
    --font-body: "IBM Plex Sans", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: oklch(17% 0.011 240);
      --surface: oklch(22% 0.013 240);
      --surface-2: oklch(27% 0.015 240);
      --ink: oklch(93% 0.006 240);
      --muted: oklch(70% 0.017 240);
      --line: oklch(33% 0.015 240);
      --red: oklch(67% 0.18 26);
      --red-deep: oklch(74% 0.17 26);
      --red-ink: oklch(82% 0.13 26);
      --red-wash: oklch(30% 0.06 26);
      --ok: oklch(72% 0.13 150);
      --ok-wash: oklch(28% 0.05 150);
      --shadow: 0 1px 2px oklch(0% 0 0 / 0.35), 0 3px 12px oklch(0% 0 0 / 0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg: oklch(17% 0.011 240);
    --surface: oklch(22% 0.013 240);
    --surface-2: oklch(27% 0.015 240);
    --ink: oklch(93% 0.006 240);
    --muted: oklch(70% 0.017 240);
    --line: oklch(33% 0.015 240);
    --red: oklch(67% 0.18 26);
    --red-deep: oklch(74% 0.17 26);
    --red-ink: oklch(82% 0.13 26);
    --red-wash: oklch(30% 0.06 26);
    --ok: oklch(72% 0.13 150);
    --ok-wash: oklch(28% 0.05 150);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.35), 0 3px 12px oklch(0% 0 0 / 0.3);
  }

  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size:15px; line-height:1.45;
    padding-bottom: 84px;
  }
  h1,h2,h3{ font-family: var(--font-display); font-weight:700; margin:0; text-wrap: balance; }
  button{ font-family: var(--font-body); }
  input, select, textarea{
    font-family: var(--font-body); font-size:16px; color: var(--ink);
    background: var(--surface); border:1px solid var(--line); border-radius: 5px;
    padding: 9px 10px; width:100%;
  }
  input[type="number"], .mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline: 2px solid var(--focus); outline-offset: 1px;
  }
  textarea{ resize: vertical; min-height: 64px; }
  label{ display:block; font-size:12.5px; color: var(--muted); margin-bottom:4px; letter-spacing:.01em; }
  .field{ margin-bottom:10px; }
  .row{ display:flex; gap:10px; }
  .row > .field{ flex:1; min-width:0; }
  .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }

  /* Top bar */
  header.top{
    position: sticky; top:0; z-index:20; background: var(--bg);
    border-bottom:1px solid var(--line); padding: 12px 14px 0 14px;
  }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .brand .word{ font-family: var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.2px; }
  .brand .word .swiss{ color: var(--red); }
  .brand .sub{ font-size:10.5px; color: var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .common-fields{ display:flex; gap:8px; padding-bottom:10px; }
  .common-fields .field{ margin-bottom:0; }
  .tabs{ display:flex; gap:2px; }
  .tab{
    flex:1; text-align:center; padding:10px 6px; font-family: var(--font-display); font-weight:600;
    font-size:14.5px; color: var(--muted); background:none; border:none; border-bottom:3px solid transparent;
    cursor:pointer;
  }
  .tab[aria-selected="true"]{ color: var(--red-ink); border-bottom-color: var(--red); }

  main{ padding: 14px 14px 0 14px; max-width: 640px; margin: 0 auto; }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .card{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 14px; overflow:hidden;
  }
  .card > summary, .card > .card-head{
    font-family: var(--font-display); font-weight:600; font-size:15.5px;
    padding: 11px 14px; cursor:pointer; list-style:none; display:flex; align-items:center;
    justify-content:space-between; gap:8px; background: var(--surface-2);
    border-bottom:1px solid var(--line);
  }
  .card > summary::-webkit-details-marker{ display:none; }
  .card > summary .chev{ transition: transform .15s ease; color: var(--muted); flex:none; }
  .card[open] > summary .chev{ transform: rotate(90deg); }
  .card-body{ padding: 13px 14px 14px 14px; }
  .card-body > .field:last-child{ margin-bottom:0; }

  .hint{ font-size:12px; color: var(--muted); margin: -4px 0 12px 0; }
  .section-label{
    font-family: var(--font-display); font-weight:600; font-size:13px; color: var(--red-ink);
    text-transform: uppercase; letter-spacing:.05em; border-bottom:1px solid var(--line);
    padding-bottom:5px; margin: 4px 0 10px 0;
  }
  .section-label:first-child{ margin-top:0; }

  .cat{ border:1px solid var(--line); border-radius:6px; padding:11px; margin-bottom:10px; background: var(--bg); }
  .cat:last-child{ margin-bottom:0; }
  .cat-title{ font-weight:600; font-size:14px; margin-bottom:8px; }
  .personal-row{ display:flex; gap:8px; align-items:flex-end; margin-bottom:8px; }
  .personal-row .field{ margin-bottom:0; }
  .personal-row .name{ flex:1.4; } .personal-row .hrs{ flex:0.8; }
  .icon-btn{
    flex:none; width:38px; height:38px; border-radius:5px; border:1px solid var(--line);
    background: var(--surface); color: var(--muted); display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
  }
  .icon-btn.danger{ color: var(--red-ink); }
  .icon-btn.danger:active{ background: var(--red-wash); }
  .add-link{
    display:flex; align-items:center; gap:6px; background:none; border:1px dashed var(--line);
    color: var(--red-ink); font-weight:600; font-size:13.5px; border-radius:6px; padding:8px 10px;
    width:100%; justify-content:center; cursor:pointer; margin-top:2px;
  }
  .add-link:active{ background: var(--red-wash); }

  .total-line{
    display:flex; justify-content:space-between; align-items:center; padding:11px 14px;
    background: var(--surface-2); border-top:1px solid var(--line); font-family: var(--font-display);
    font-weight:700; font-size:15px;
  }
  .total-line .val{ font-family: var(--font-mono); font-size:17px; }

  .anker-row{ border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:12px; background: var(--bg); position:relative; }
  .anker-row-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
  .anker-row-head .idx{ font-family: var(--font-display); font-weight:700; color: var(--red-ink); font-size:14.5px; }
  .anker-row-head .actions{ display:flex; gap:6px; }

  .diverse-item{ border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .diverse-item:first-of-type{ border-top:none; margin-top:0; padding-top:0; }
  .diverse-check{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; cursor:pointer; }
  .diverse-check input[type="checkbox"]{ width:19px; height:19px; flex:none; accent-color: var(--red); }
  .hint-inline{ font-weight:400; color: var(--muted); font-size:12px; }
  .diverse-body{ margin-top:10px; padding-left:27px; }

  .bottom-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:20; background: var(--surface);
    border-top:1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
    display:flex; gap:10px; box-shadow: 0 -2px 10px oklch(20% 0 0 / .08);
  }
  .btn{
    font-family: var(--font-display); font-weight:600; font-size:14.5px; letter-spacing:.01em;
    border-radius:6px; padding:11px 14px; border:1px solid var(--line); background: var(--surface);
    color: var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; flex:1;
  }
  .btn.primary{ background: var(--red); border-color: var(--red); color: oklch(99% 0 0); }
  .btn.primary:active{ background: var(--red-deep); }
  .btn.ghost{ background:none; }
  .btn:active{ background: var(--surface-2); }

  .banner{
    display:flex; align-items:center; gap:10px; background: var(--red-wash); color: var(--red-ink);
    border:1px solid var(--red); border-radius:6px; padding:10px 12px; margin-bottom:14px; font-size:13.5px;
  }
  .banner button{ margin-left:auto; flex:none; }
  .banner strong{ font-family: var(--font-display); }

  .save-pill{
    position:fixed; top:10px; right:12px; z-index:30; font-size:11.5px; color: var(--ok);
    background: var(--ok-wash); border:1px solid var(--ok); border-radius:20px; padding:3px 10px;
    opacity:0; transition: opacity .25s ease; pointer-events:none; font-family: var(--font-mono);
  }
  .save-pill.show{ opacity:1; }

  .hist-item{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px 14px; margin-bottom:10px; display:flex; align-items:center; gap:10px;
  }
  .hist-item .meta{ flex:1; min-width:0; }
  .hist-item .date{ font-family: var(--font-display); font-weight:700; font-size:15px; }
  .hist-item .sub{ font-size:12.5px; color: var(--muted); }
  .hist-empty{ color: var(--muted); font-size:13.5px; text-align:center; padding: 30px 10px; }
  .hist-actions{ display:flex; gap:6px; }

  svg.ic{ width:18px; height:18px; stroke: currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* #printSheet is kept off-screen (not display:none) so it has real layout —
     both for the browser's print dialog AND so html2canvas can rasterize it
     when generating a PDF for the downloads capability. */
  #printSheet{
    position:fixed; left:-10000px; top:0; width:780px; background:#fff;
    font-family: Arial, Helvetica, sans-serif; color:#111; font-size:10.5px; padding:24px;
  }
  #printSheet table{ border-collapse:collapse; width:100%; }
  #printSheet td, #printSheet th{ border:1px solid #888; padding:4px 5px; text-align:left; vertical-align:top; }
  #printSheet th{ background:#e2e2e2; }
  #printSheet h1{ font-size:19px; margin:0 0 2px 0; }
  #printSheet .ph{ font-size:16px; font-weight:800; }
  #printSheet .ph .swiss{ color:#c2202c; }
  #printSheet .phead{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  #printSheet .meta{ font-size:11.5px; margin-bottom:10px; }
  #printSheet .meta div{ margin-bottom:2px; }
  #printSheet .section{ font-weight:700; background:#e2e2e2; padding:3px 5px; margin:10px 0 4px 0; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }

  @media print{
    header.top, .bottom-bar, .save-pill, .no-print{ display:none !important; }
    main{ display:none !important; }
    body{ padding-bottom:0; background:#fff; }
    #printSheet{ position:static; left:auto; }
  }
</style>

<div class="save-pill" id="savePill">gravado</div>

<datalist id="personalOptions">
  <option value="Bruno"></option><option value="Reimi"></option><option value="Marcos"></option>
  <option value="Diego"></option><option value="Arben"></option><option value="Antonio"></option>
  <option value="André"></option><option value="Décio Miguel"></option><option value="Pedro"></option>
  <option value="Alcino"></option><option value="José"></option><option value="Filipe"></option>
  <option value="Eber"></option>
</datalist>
<datalist id="typOptions">
  <option value="KSB R32-15"></option><option value="KSB R38"></option><option value="KSB R51"></option>
  <option value="KSB T76 6T"></option><option value="KSB T76 8T"></option><option value="KSB T76 10T"></option>
  <option value="KSB T76 12T"></option><option value="KSB T114"></option>
</datalist>
<datalist id="netzeTypOptions">
  <option value="K188"></option><option value="K335"></option><option value="B500a"></option><option value="B500b"></option>
</datalist>
<datalist id="moertelTypOptions">
  <option value="Dorodur H50"></option><option value="Sack (Hug)"></option>
</datalist>
<datalist id="gunitTypOptions">
  <option value="FBB 300"></option><option value="FBB 350 Recycling"></option><option value="Fixit 525"></option>
  <option value="Fixit 526"></option><option value="Hastag"></option><option value="Kibag"></option>
  <option value="JMS"></option><option value="Toggenburg"></option>
</datalist>
<datalist id="zusaetzeTypOptions">
  <option value="Mapei 777"></option>
</datalist>

<header class="top">
  <div class="brand">
    <div class="word"><span class="swiss">swiss</span>bohr</div>
    <div class="sub">Rapport digital</div>
  </div>
  <div class="common-fields">
    <div class="field">
      <label for="auftraggeber">Auftraggeber</label>
      <input id="auftraggeber" type="text" placeholder="Name des Auftraggebers">
    </div>
    <div class="field">
      <label for="baustelle">Baustelle</label>
      <input id="baustelle" type="text" placeholder="Ort / Projekt">
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabBtnTag" role="tab" aria-selected="true">Tagesrapport</button>
    <button class="tab" id="tabBtnAnker" role="tab" aria-selected="false">Ankerprotokoll</button>
    <button class="tab" id="tabBtnHist" role="tab" aria-selected="false">Verlauf</button>
  </div>
</header>

<main>

  <!-- TAGESRAPPORT -->
  <section class="panel active" id="panelTag">
    <div id="tagBanner"></div>

    <div class="row">
      <div class="field">
        <label for="tagDatum">Datum</label>
        <input id="tagDatum" type="date">
      </div>
      <div class="field">
        <label for="tagWetter">Wetter</label>
        <input id="tagWetter" type="text" list="wetterOptions" placeholder="z. B. sonnig">
        <datalist id="wetterOptions">
          <option value="Sonnig"></option><option value="Teilweise bewölkt"></option><option value="Bewölkt"></option>
          <option value="Bedeckt"></option><option value="Regen"></option><option value="Starkregen"></option>
          <option value="Gewitter"></option><option value="Schnee"></option><option value="Schneeregen"></option>
          <option value="Nebel"></option><option value="Frost"></option><option value="Starker Wind"></option>
          <option value="Hitze"></option>
        </datalist>
      </div>
    </div>

    <details class="card" open>
      <summary>Aufgeführte Arbeiten <svg class="ic chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></summary>
      <div class="card-body" id="catsContainer"></div>
      <div class="total-line"><span>Total Stunden</span><span class="val" id="totalStunden">0</span></div>
    </details>

    <details class="card">
      <summary>Material <svg class="ic chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></summary>
      <div class="card-body">
        <div class="section-label">Anker / Pfähle</div>
        <div id="ankerPfaehleContainer"></div>
        <button type="button" class="add-link" id="addAnkerPfahl">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Zeile hinzufügen
        </button>

        <div class="section-label" style="margin-top:16px">Weiteres Material</div>
        <div class="row">
          <div class="field"><label for="moertelTyp">Mörtel Typ</label><input id="moertelTyp" type="text" list="moertelTypOptions"></div>
          <div class="field"><label for="moertelKg">kg</label><input id="moertelKg" type="number" inputmode="decimal"></div>
        </div>
        <div class="row">
          <div class="field"><label for="netzeTyp">Netze Typ</label><input id="netzeTyp" type="text" list="netzeTypOptions"></div>
          <div class="field"><label for="netzeM2b">m²</label><input id="netzeM2b" type="number" inputmode="decimal"></div>
        </div>
        <div class="row">
          <div class="field"><label for="gunitTyp">Gunit Typ</label><input id="gunitTyp" type="text" list="gunitTypOptions"></div>
          <div class="field"><label for="gunitM3">m³ lose</label><input id="gunitM3" type="number" inputmode="decimal"></div>
        </div>
        <div class="row">
          <div class="field"><label for="zusaetzeTyp">Zusätze Typ</label><input id="zusaetzeTyp" type="text" list="zusaetzeTypOptions"></div>
          <div class="field"><label for="zusaetzeKgL">kg, l</label><input id="zusaetzeKgL" type="text"></div>
        </div>
        <div class="field"><label for="diversesMaterial">Diverses</label><textarea id="diversesMaterial" rows="2"></textarea></div>
      </div>
    </details>

    <details class="card">
      <summary>Fahrzeuge <svg class="ic chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></summary>
      <div class="card-body">
        <div class="row">
          <div class="field"><label for="lkwStd">LKW Std</label><input id="lkwStd" type="number" inputmode="decimal"></div>
          <div class="field"><label for="pwKm">PW km</label><input id="pwKm" type="number" inputmode="decimal"></div>
          <div class="field"><label for="dieselL">Dieselbezug l</label><input id="dieselL" type="number" inputmode="decimal"></div>
        </div>
      </div>
    </details>

    <details class="card">
      <summary>Bemerkungen &amp; Unterschrift <svg class="ic chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></summary>
      <div class="card-body">
        <div class="field"><label for="bemerkungenTag">Bemerkungen</label><textarea id="bemerkungenTag" rows="3"></textarea></div>
        <div class="field"><label for="unterschriftTag">Unterschrift (Name)</label><input id="unterschriftTag" type="text" placeholder="Name eintippen"></div>
      </div>
    </details>
  </section>

  <!-- ANKERPROTOKOLL -->
  <section class="panel" id="panelAnker">
    <div id="ankerBanner"></div>
    <div class="field"><label for="etappe">Etappe</label><input id="etappe" type="text" placeholder="z. B. Etappe 2"></div>

    <div class="section-label">Anker</div>
    <div id="ankerRowsContainer"></div>
    <button type="button" class="add-link" id="addAnkerRow">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Neuer Anker
    </button>
  </section>

  <!-- HISTORY -->
  <section class="panel" id="panelHist">
    <div class="section-label">Abgeschlossene Tagesrapporte</div>
    <div id="histTagList"></div>
    <div class="section-label" style="margin-top:18px">Abgeschlossene Etappen</div>
    <div id="histEtappeList"></div>
  </section>

</main>

<div class="bottom-bar no-print" id="barTag">
  <button class="btn ghost" id="btnNewDay">
    <svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg> Neuer Tag
  </button>
  <button class="btn primary" id="btnExportTag">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 3v13m0 0l-4-4m4 4l4-4M5 21h14"/></svg> Als PDF exportieren
  </button>
</div>
<div class="bottom-bar no-print" id="barAnker" style="display:none">
  <button class="btn ghost" id="btnNewEtappe">
    <svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg> Neue Etappe
  </button>
  <button class="btn primary" id="btnExportAnker">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 3v13m0 0l-4-4m4 4l4-4M5 21h14"/></svg> Als PDF exportieren
  </button>
</div>

<div id="printSheet"></div>

<script>
(function(){
  "use strict";

  var LS = { common:"sb_common_v1", tag:"sb_tag_v1", anker:"sb_anker_v1", hist:"sb_hist_v1" };

  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+"-"+m+"-"+day;
  }
  function fmtDate(iso){
    if(!iso) return "";
    var p = iso.split("-"); if(p.length!==3) return iso;
    return p[2]+"."+p[1]+"."+p[0];
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function safeGet(key, fallback){
    try{ var raw = localStorage.getItem(key); if(!raw) return fallback; return JSON.parse(raw); }
    catch(e){ return fallback; }
  }
  function safeSet(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ return false; }
  }
  var pillTimer = null;

    var pill = document.getElementById('savePill');

  /* Custom confirm overlay — avoids relying on window.confirm(), which can be
     silently blocked inside a sandboxed embed. */
  function showConfirm(message, onYes){
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;';
    var box = document.createElement('div');
    box.style.cssText = 'background:var(--surface);color:var(--ink);border-radius:8px;padding:18px;max-width:320px;width:100%;box-shadow:var(--shadow);font-family:var(--font-body);';
    box.innerHTML = '<div style="margin-bottom:16px;font-size:14.5px;line-height:1.4;">'+message+'</div>'+
      '<div style="display:flex;gap:8px;justify-content:flex-end;">'+
      '<button type="button" data-cf="no" class="btn ghost" style="flex:none;padding:9px 14px;">Abbrechen</button>'+
      '<button type="button" data-cf="yes" class="btn primary" style="flex:none;padding:9px 14px;">Bestätigen</button></div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){
      if(e.target === overlay){ overlay.remove(); return; }
      var b = e.target.closest('[data-cf]');
      if(!b) return;
      overlay.remove();
      if(b.getAttribute('data-cf') === 'yes') onYes();
    });
  }

  function showNotice(message){
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;';
    var box = document.createElement('div');
    box.style.cssText = 'background:var(--surface);color:var(--ink);border-radius:8px;padding:18px;max-width:320px;width:100%;box-shadow:var(--shadow);font-family:var(--font-body);';
    box.innerHTML = '<div style="margin-bottom:16px;font-size:14.5px;line-height:1.4;">'+message+'</div>'+
      '<div style="display:flex;justify-content:flex-end;"><button type="button" data-nf="ok" class="btn primary" style="flex:none;padding:9px 14px;">OK</button></div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){
      if(e.target === overlay || e.target.closest('[data-nf]')) overlay.remove();
    });
  }
  function isFramed(){
    try { return window.self !== window.top; } catch(e){ return true; }
  }

  function showPrompt(message, defaultValue, onSubmit){
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;';
    var box = document.createElement('div');
    box.style.cssText = 'background:var(--surface);color:var(--ink);border-radius:8px;padding:18px;max-width:320px;width:100%;box-shadow:var(--shadow);font-family:var(--font-body);';
    box.innerHTML = '<div style="margin-bottom:12px;font-size:14.5px;line-height:1.4;">'+message+'</div>'+
      '<input type="number" inputmode="numeric" min="1" max="50" value="'+esc(defaultValue)+'" data-prompt-input style="margin-bottom:14px;">'+
      '<div style="display:flex;gap:8px;justify-content:flex-end;">'+
      '<button type="button" data-pf="no" class="btn ghost" style="flex:none;padding:9px 14px;">Abbrechen</button>'+
      '<button type="button" data-pf="yes" class="btn primary" style="flex:none;padding:9px 14px;">Erstellen</button></div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    var input = box.querySelector('[data-prompt-input]');
    setTimeout(function(){ input.focus(); input.select(); }, 30);
    function finish(submit){
      var val = input.value;
      overlay.remove();
      if(submit) onSubmit(val);
    }
    overlay.addEventListener('click', function(e){
      if(e.target === overlay){ finish(false); return; }
      var b = e.target.closest('[data-pf]');
      if(!b) return;
      finish(b.getAttribute('data-pf') === 'yes');
    });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    });
  }

  function freshCategories(){
    var out = {};
    CATS.forEach(function(c){
      var qty = {};
      c.qty.forEach(function(f){ qty[f.k] = ''; });
      out[c.key] = { qty: qty, personal: [] };
    });
    return out;
  }
  function freshDiverses(){
    var out = {};
    DIVERSE_OPTIONS.forEach(function(o){ out[o.key] = { selected:false, personal:[], remark:'' }; });
    return out;
  }
  function sumDiversesStunden(diversesObj){
    var t = 0;
    if(!diversesObj) return t;
    DIVERSE_OPTIONS.forEach(function(o){
      var it = diversesObj[o.key]; if(!it) return;
      (it.personal||[]).forEach(function(p){ var n=parseFloat(p.stunden); if(!isNaN(n)) t+=n; });
    });
    return t;
  }
  function freshTag(dateStr){
    return {
      datum: dateStr, wetter: '',
      categories: freshCategories(),
      diverses: freshDiverses(),
      material: { ankerPfaehle:[{typ:'',l:'',stk:''}], moertelTyp:'', moertelKg:'', netzeTyp:'', netzeM2:'', gunitTyp:'', gunitM3:'', zusaetzeTyp:'', zusaetzeKgL:'', diversesMaterial:'' },
      fahrzeuge: { lkwStd:'', pwKm:'', dieselL:'' },
      bemerkungen: '', unterschrift: ''
    };
  }
  function makeAnkerRow(prefill){
    prefill = prefill || {};
    return {
      datum: prefill.datum || todayISO(), wand: prefill.wand || '', lage: prefill.lage || '', nr: prefill.nr || '',
      ankertyp: prefill.ankertyp || '', ankerlaenge: '', freieLaenge: '',
      primZement: '', primDruck: '', nachZement: '', nachDruck: '', pruflast: '', bemerkungen: ''
    };
  }

  var common = Object.assign({auftraggeber:'', baustelle:''}, safeGet(LS.common, {}));
  var tag = Object.assign(freshTag(todayISO()), safeGet(LS.tag, {}));
  if(!tag.categories) tag.categories = freshCategories();

  /* One-time migration from the earlier schema (separate bohren/versetzen/
     spannen categories and a free-text Diverses) into the current one. */
  (function migrateTag(){
    var legacyBohren = tag.categories.bohren, legacyVersetzen = tag.categories.versetzen, legacySpannen = tag.categories.spannen;
    if(legacyBohren || legacyVersetzen || legacySpannen){
      if(!tag.categories.anker_pfaehle) tag.categories.anker_pfaehle = {qty:{}, personal:[]};
      var ap = tag.categories.anker_pfaehle;
      ap.qty.bohren_m = (legacyBohren && legacyBohren.qty && legacyBohren.qty.m) || ap.qty.bohren_m || '';
      ap.qty.versetzen_m = (legacyVersetzen && legacyVersetzen.qty && legacyVersetzen.qty.m) || ap.qty.versetzen_m || '';
      ap.qty.spannen_stk = (legacySpannen && legacySpannen.qty && legacySpannen.qty.stk) || ap.qty.spannen_stk || '';
      var mergedPersonal = []
        .concat((legacyBohren && legacyBohren.personal) || [])
        .concat((legacyVersetzen && legacyVersetzen.personal) || [])
        .concat((legacySpannen && legacySpannen.personal) || []);
      if(mergedPersonal.length) ap.personal = (ap.personal||[]).concat(mergedPersonal);
      delete tag.categories.bohren; delete tag.categories.versetzen; delete tag.categories.spannen;
    }
    var legacyDiverses = tag.categories.diverses;
    if(legacyDiverses && legacyDiverses.qty && legacyDiverses.qty.beschreibung){
      tag.bemerkungen = (tag.bemerkungen ? tag.bemerkungen + ' | ' : '') + 'Diverses (alt): ' + legacyDiverses.qty.beschreibung;
    }
    if(legacyDiverses) delete tag.categories.diverses;
    if(!tag.diverses) tag.diverses = freshDiverses();
    else DIVERSE_OPTIONS.forEach(function(o){ if(!tag.diverses[o.key]) tag.diverses[o.key] = {selected:false, personal:[], remark:''}; });
  })();

  CATS.forEach(function(c){
    if(!tag.categories[c.key]) tag.categories[c.key] = {qty:{}, personal:[]};
    if(!tag.categories[c.key].personal) tag.categories[c.key].personal = [];
    if(!tag.categories[c.key].qty) tag.categories[c.key].qty = {};
    c.qty.forEach(function(f){ if(tag.categories[c.key].qty[f.k]===undefined) tag.categories[c.key].qty[f.k]=''; });
  });
  var anker = Object.assign({ etappe:'', rows:[ makeAnkerRow() ] }, safeGet(LS.anker, {}));
  if(!anker.rows || !anker.rows.length) anker.rows = [ makeAnkerRow() ];
  var hist = Object.assign({ tage:[], etapas:[] }, safeGet(LS.hist, {}));
  if(!hist.tage) hist.tage = [];
  if(!hist.etapas) hist.etapas = [];

  function saveCommon(){ safeSet(LS.common, common); flashSaved(); }
  function saveTag(){ safeSet(LS.tag, tag); flashSaved(); }

  function saveHist(){ safeSet(LS.hist, hist); flashSaved(); }

  bindText('zusaetzeTyp', function(){return tag.material.zusaetzeTyp;}, function(v){tag.material.zusaetzeTyp=v;}, saveTag);
  bindText('zusaetzeKgL', function(){return tag.material.zusaetzeKgL;}, function(v){tag.material.zusaetzeKgL=v;}, saveTag);
  bindText('diversesMaterial', function(){return tag.material.diversesMaterial;}, function(v){tag.material.diversesMaterial=v;}, saveTag);
  bindText('lkwStd', function(){return tag.fahrzeuge.lkwStd;}, function(v){tag.fahrzeuge.lkwStd=v;}, saveTag);
  bindText('pwKm', function(){return tag.fahrzeuge.pwKm;}, function(v){tag.fahrzeuge.pwKm=v;}, saveTag);

  /* ---------- tabs ---------- */
  var tabs = [
    {btn:'tabBtnTag', panel:'panelTag', bar:'barTag'},
    {btn:'tabBtnAnker', panel:'panelAnker', bar:'barAnker'},
    {btn:'tabBtnHist', panel:'panelHist', bar:null}
  ];
  function selectTab(name){
    tabs.forEach(function(t){
      var isSel = t.panel === name;
      document.getElementById(t.btn).setAttribute('aria-selected', isSel ? 'true':'false');
      document.getElementById(t.panel).classList.toggle('active', isSel);
      if(t.bar) document.getElementById(t.bar).style.display = isSel ? 'flex':'none';
    });
    if(name === 'panelHist') renderHistory();
  }
  document.getElementById('tabBtnTag').addEventListener('click', function(){ selectTab('panelTag'); });

  /* ---------- Aufgeführte Arbeiten / categories ---------- */
  function totalStunden(){
    var t = 0;
    CATS.forEach(function(c){
      tag.categories[c.key].personal.forEach(function(p){ var n = parseFloat(p.stunden); if(!isNaN(n)) t += n; });
    });
    t += sumDiversesStunden(tag.diverses);
    return t;
  }
  function personalRowHTML(name, stunden, attrs){
    return '<div class="personal-row" '+attrs+'>'+
      '<div class="field name"><input type="text" list="personalOptions" placeholder="Personal" '+attrs+' data-pfield="name" value="'+esc(name)+'"></div>'+
      '<div class="field hrs"><input type="number" inputmode="decimal" placeholder="Std" '+attrs+' data-pfield="stunden" value="'+esc(stunden)+'"></div>'+
      '<button type="button" class="icon-btn danger" '+attrs+' data-remove-personal aria-label="Entfernen"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg></button>'+
    '</div>';
  }
  function renderCats(){
    var root = document.getElementById('catsContainer');
    var catsHtml = CATS.map(function(c){
      var st = tag.categories[c.key];
      var qtyInputs = c.qty.map(function(f){
        var listAttr = f.list ? ' list="'+f.list+'"' : '';
        return '<div class="field"><label>'+esc(f.label)+'</label><input type="'+(f.type==='number'?'number':'text')+'" '+(f.type==='number'?'inputmode="decimal"':'')+listAttr+' data-cat="'+c.key+'" data-qty="'+f.k+'" value="'+esc(st.qty[f.k])+'"></div>';
      }).join('');
      var personalRows = st.personal.map(function(p, i){
        return personalRowHTML(p.name, p.stunden, 'data-cat="'+c.key+'" data-pidx="'+i+'"');
      }).join('');
      return '<div class="cat">'+
        '<div class="cat-title">'+esc(c.label)+'</div>'+
        (qtyInputs ? '<div class="row">'+qtyInputs+'</div>' : '')+
        personalRows+
        '<button type="button" class="add-link" data-add-personal="'+c.key+'"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Personal / Stunden</button>'+
      '</div>';
    }).join('');

    var diversesHtml = '<div class="cat">'+
      '<div class="cat-title">Diverses</div>'+
      DIVERSE_OPTIONS.map(function(o){
        var it = tag.diverses[o.key];
        var body = '';
        if(it.selected){
          var personalRows = it.personal.map(function(p, i){
            return personalRowHTML(p.name, p.stunden, 'data-dv="'+o.key+'" data-pidx="'+i+'"');
          }).join('');
          body = '<div class="diverse-body">'+
            '<div class="field"><label>Bemerkung'+(o.hint?' ('+esc(o.hint)+')':'')+'</label><input type="text" data-dv-remark="'+o.key+'" value="'+esc(it.remark)+'" placeholder="optional"></div>'+
            personalRows+
            '<button type="button" class="add-link" data-dv-add-personal="'+o.key+'"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Personal / Stunden</button>'+
          '</div>';
        }
        return '<div class="diverse-item">'+
          '<label class="diverse-check"><input type="checkbox" data-dv-toggle="'+o.key+'" '+(it.selected?'checked':'')+'> '+esc(o.label)+'</label>'+
          body+
        '</div>';
      }).join('')+
    '</div>';

    root.innerHTML = catsHtml + diversesHtml;
    document.getElementById('totalStunden').textContent = totalStunden().toLocaleString('de-CH');
  }
  document.getElementById('catsContainer').addEventListener('input', function(e){
    var t = e.target;
    var cat = t.getAttribute('data-cat');
    var dv = t.getAttribute('data-dv');
    if(cat){
      if(t.hasAttribute('data-qty')){
        tag.categories[cat].qty[t.getAttribute('data-qty')] = t.value;
        saveTag();
      } else if(t.hasAttribute('data-pfield')){
        var idx = parseInt(t.getAttribute('data-pidx'),10);
        tag.categories[cat].personal[idx][t.getAttribute('data-pfield')] = t.value;
        saveTag();
        if(t.getAttribute('data-pfield')==='stunden') document.getElementById('totalStunden').textContent = totalStunden().toLocaleString('de-CH');
      }
    } else if(t.hasAttribute('data-dv-remark')){
      tag.diverses[t.getAttribute('data-dv-remark')].remark = t.value;
      saveTag();
    } else if(dv && t.hasAttribute('data-pfield')){
      var didx = parseInt(t.getAttribute('data-pidx'),10);
      tag.diverses[dv].personal[didx][t.getAttribute('data-pfield')] = t.value;
      saveTag();
      if(t.getAttribute('data-pfield')==='stunden') document.getElementById('totalStunden').textContent = totalStunden().toLocaleString('de-CH');
    } else if(t.hasAttribute('data-dv-toggle')){
      var key = t.getAttribute('data-dv-toggle');
      tag.diverses[key].selected = t.checked;
      saveTag(); renderCats();
    }
  });
  document.getElementById('catsContainer').addEventListener('click', function(e){
    var addBtn = e.target.closest('[data-add-personal]');
    if(addBtn){
      tag.categories[addBtn.getAttribute('data-add-personal')].personal.push({name:'', stunden:''});
      saveTag(); renderCats(); return;
    }
    var dvAddBtn = e.target.closest('[data-dv-add-personal]');
    if(dvAddBtn){
      tag.diverses[dvAddBtn.getAttribute('data-dv-add-personal')].personal.push({name:'', stunden:''});
      saveTag(); renderCats(); return;
    }
    var rmBtn = e.target.closest('[data-remove-personal]');
    if(rmBtn){
      var cat = rmBtn.getAttribute('data-cat');
      var dv = rmBtn.getAttribute('data-dv');
      if(cat) tag.categories[cat].personal.splice(parseInt(rmBtn.getAttribute('data-pidx'),10), 1);
      else if(dv) tag.diverses[dv].personal.splice(parseInt(rmBtn.getAttribute('data-pidx'),10), 1);
      saveTag(); renderCats();
    }
  });

  function renderAnkerRows(){

    root.innerHTML = anker.rows.map(function(r, i){

        var listAttr = f.list ? ' list="'+f.list+'"' : '';
        return '<div class="field"><label>'+esc(f.label)+'</label><input type="'+f.type+'" '+(f.type==='number'?'inputmode="decimal"':'')+listAttr+' data-arf="'+f.k+'" data-aridx="'+i+'" value="'+esc(r[f.k])+'"></div>';
      }).join('');
      return '<div class="anker-row" data-aridx="'+i+'">'+
        '<div class="anker-row-head"><span class="idx">Anker '+(i+1)+'</span>'+
        '<div class="actions">'+
        '<button type="button" class="icon-btn" data-ar-copy="'+i+'" aria-label="Kopieren"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>'+
        '<button type="button" class="icon-btn danger" data-ar-remove="'+i+'" aria-label="Entfernen"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg></button>'+
        '</div></div>'+
        '<div class="grid2">'+inputs+'</div>'+
        '<div class="field" style="margin-top:2px"><label>Bemerkungen</label><textarea rows="2" data-arf="bemerkungen" data-aridx="'+i+'">'+esc(r.bemerkungen)+'</textarea></div>'+
      '</div>';
    }).join('');
  }
  document.getElementById('ankerRowsContainer').addEventListener('input', function(e){
    var t = e.target;
    if(t.hasAttribute('data-arf')){
      anker.rows[parseInt(t.getAttribute('data-aridx'),10)][t.getAttribute('data-arf')] = t.value;
      saveAnker();
    }
  });
  document.getElementById('ankerRowsContainer').addEventListener('click', function(e){
    var cp = e.target.closest('[data-ar-copy]');
    if(cp){
      var srcIdx = parseInt(cp.getAttribute('data-ar-copy'),10);
      var src = anker.rows[srcIdx];
      showPrompt('Wie viele Kopien dieses Ankers erstellen?<br><span class="hint-inline">Jede Kopie übernimmt alle Werte und kann danach einzeln angepasst werden.</span>', '1', function(val){
        var n = parseInt(val,10);
        if(!n || n<1) return;
        if(n>50) n=50;
        var mNr = /^(\d+)$/.exec(String(src.nr||'').trim());
        for(var i=0;i<n;i++){
          var copy = JSON.parse(JSON.stringify(src));
          if(mNr) copy.nr = String(parseInt(mNr[1],10) + i + 1);
          anker.rows.splice(srcIdx + 1 + i, 0, copy);
        }
        saveAnker(); renderAnkerRows();
      });
      return;
    }
    var rm = e.target.closest('[data-ar-remove]');
    if(rm){
      if(anker.rows.length <= 1){ anker.rows[0] = makeAnkerRow(); }
      else anker.rows.splice(parseInt(rm.getAttribute('data-ar-remove'),10),1);
      saveAnker(); renderAnkerRows();
    }
  });
  document.getElementById('addAnkerRow').addEventListener('click', function(){
    var last = anker.rows[anker.rows.length-1] || {};
    var nr = last.nr;
    var m = /^(\d+)$/.exec(String(nr||'').trim());
    var nextNr = m ? String(parseInt(m[1],10)+1) : '';
    anker.rows.push(makeAnkerRow({ datum: todayISO(), wand:last.wand, lage:last.lage, ankertyp:last.ankertyp, nr: nextNr }));
    saveAnker(); renderAnkerRows();
  });

  /* ---------- New day / new stage ---------- */
  function renderTagBanner(){
    var el = document.getElementById('tagBanner');
    if(tag.datum && tag.datum !== todayISO()){
      el.innerHTML = '<div class="banner"><span><strong>Hinweis:</strong> Dieser Rapport ist vom '+esc(fmtDate(tag.datum))+'.</span><button type="button" class="btn ghost" id="bannerNewDay" style="flex:none;padding:6px 10px">Neuer Tag</button></div>';
      document.getElementById('bannerNewDay').addEventListener('click', doNewDay);
    } else {
      el.innerHTML = '';
    }
  }
  function summarizeTag(t){
    var std = 0;
    CATS.forEach(function(c){ (t.categories[c.key]||{personal:[]}).personal.forEach(function(p){ var n=parseFloat(p.stunden); if(!isNaN(n)) std+=n; }); });
    std += sumDiversesStunden(t.diverses);
    return std;
  }
  function doNewDay(){
    showConfirm('Aktuellen Tagesrapport abschliessen und archivieren?<br>Ein neuer Tag wird begonnen.', function(){
      hist.tage.unshift({ id: 'd'+Date.now(), date: tag.datum, snapshot: JSON.parse(JSON.stringify(tag)) });
      saveHist();
      tag = freshTag(todayISO());
      saveTag();
      renderAll();
    });
  }
  document.getElementById('btnNewDay').addEventListener('click', doNewDay);

  function doNewEtappe(){
    showConfirm('Aktuelle Etappe abschliessen und archivieren?<br>Die Ankerliste wird geleert.', function(){
      hist.etapas.unshift({ id:'e'+Date.now(), etappe: anker.etappe, baustelle: common.baustelle, date: todayISO(), rows: JSON.parse(JSON.stringify(anker.rows)) });
      saveHist();

  /* ---------- History ---------- */

          '<button type="button" class="icon-btn danger" data-hist-del-tag="'+h.id+'" aria-label="Löschen"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg></button>'+

    var etRoot = document.getElementById('histEtappeList');

      etRoot.innerHTML = '<div class="hist-empty">Noch keine abgeschlossenen Etappen.</div>';
    } else {
      etRoot.innerHTML = hist.etapas.map(function(h){
        return '<div class="hist-item"><div class="meta"><div class="date">'+esc(h.etappe||'(ohne Bezeichnung)')+'</div>'+
          '<div class="sub">'+h.rows.length+' Anker · abgeschlossen '+esc(fmtDate(h.date))+'</div></div>'+
          '<div class="hist-actions">'+
          '<button type="button" class="icon-btn" data-hist-print-etappe="'+h.id+'" aria-label="Drucken"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg></button>'+
          '<button type="button" class="icon-btn danger" data-hist-del-etappe="'+h.id+'" aria-label="Löschen"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg></button>'+
          '</div></div>';
      }).join('');

  document.getElementById('panelHist').addEventListener('click', function(e){
    var pt = e.target.closest('[data-hist-print-tag]');
    if(pt){ var h = hist.tage.find(function(x){return x.id===pt.getAttribute('data-hist-print-tag');}); if(h) printTag(h.snapshot, pt); return; }
    var dt = e.target.closest('[data-hist-del-tag]');
    if(dt){ var idTag = dt.getAttribute('data-hist-del-tag'); showConfirm('Diesen Eintrag löschen?', function(){ hist.tage = hist.tage.filter(function(x){return x.id!==idTag;}); saveHist(); renderHistory(); }); return; }
    var pe = e.target.closest('[data-hist-print-etappe]');
    if(pe){ var he = hist.etapas.find(function(x){return x.id===pe.getAttribute('data-hist-print-etappe');}); if(he) printAnker(he.etappe, he.rows, pe); return; }
    var de = e.target.closest('[data-hist-del-etappe]');
    if(de){ var idEt = de.getAttribute('data-hist-del-etappe'); showConfirm('Diesen Eintrag löschen?', function(){ hist.etapas = hist.etapas.filter(function(x){return x.id!==idEt;}); saveHist(); renderHistory(); }); return; }
  });

  /* ---------- Print / PDF export ----------
     Two paths, tried in order:
     1) Inside the published Artifact, window.print()/downloads are the
        viewer's "downloads" capability: we rasterize #printSheet with
        html2canvas, assemble a PDF with jsPDF, and hand it to
        claude.use('downloads').save(). This is the only way to get a real
        file out of a sandboxed Artifact frame — window.print() is inert there.
     2) Everywhere else (the standalone file, or a copy hosted on a normal
        website), window.claude does not exist at all, so we fall back to
        window.print(), which works normally in a real, un-sandboxed page. */
  var pageStyleTag = document.createElement('style');
  document.head.appendChild(pageStyleTag);
  function setPageOrientation(o){
    pageStyleTag.textContent = '@page{ size: A4 '+o+'; margin: '+(o==='landscape'?'10mm':'12mm')+'; }';
  }

  async function buildPdfBlob(landscape){
    if (typeof html2canvas !== 'function' || !window.jspdf || !window.jspdf.jsPDF) return null;
    var sheet = document.getElementById('printSheet');
    sheet.style.width = landscape ? '1100px' : '780px';
    await new Promise(function(r){ setTimeout(r, 60); }); // let fonts/layout settle
    var canvas = await html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    var imgData = canvas.toDataURL('image/jpeg', 0.92);
    var pageWmm = landscape ? 297 : 210, pageHmm = landscape ? 210 : 297;
    var doc = new window.jspdf.jsPDF({ orientation: landscape ? 'landscape':'portrait', unit:'mm', format:'a4' });
    var imgWmm = pageWmm - 20;
    var imgHmm = imgWmm * canvas.height / canvas.width;
    var pageContentHmm = pageHmm - 20;
    if (imgHmm <= pageContentHmm){
      doc.addImage(imgData, 'JPEG', 10, 10, imgWmm, imgHmm);
    } else {
      var sliceCanvasHeightPx = Math.max(1, Math.floor(canvas.height * pageContentHmm / imgHmm));
      var totalPages = Math.ceil(canvas.height / sliceCanvasHeightPx);
      for (var p = 0; p < totalPages; p++){
        if (p > 0) doc.addPage();
        var sy = p * sliceCanvasHeightPx;
        var sh = Math.min(sliceCanvasHeightPx, canvas.height - sy);
        var pageCanvas = document.createElement('canvas');
        pageCanvas.width = canvas.width; pageCanvas.height = sh;
        var ctx = pageCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
        ctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
        var sliceHmm = imgWmm * sh / canvas.width;
        doc.addImage(pageCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', 10, 10, imgWmm, sliceHmm);
      }
    }
    return doc.output('blob');
  }

  function setBtnBusy(btn, busy, busyLabel){
    if(!btn) return;
    if(busy){ btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.style.opacity = '.65'; btn.textContent = busyLabel; }
    else { btn.disabled = false; btn.style.opacity = ''; if(btn.dataset.label) btn.innerHTML = btn.dataset.label; }
  }

  async function finishExport(html, landscape, filenameBase, btn){
    setPageOrientation(landscape ? 'landscape' : 'portrait');
    document.getElementById('printSheet').innerHTML = html;
    var usedDownloads = false;
    if (window.claude && typeof window.claude.use === 'function'){
      setBtnBusy(btn, true, 'PDF wird erstellt…');
      try{
        var downloads = await window.claude.use('downloads');
        if (downloads){
          var blob = await buildPdfBlob(landscape);
          if (blob){
            await downloads.save({ filename: filenameBase + '.pdf', data: blob });
            usedDownloads = true;
          }
        }
      } catch(e){
        // declined / rate_limited / etc. — fall through silently to print()
      }
      setBtnBusy(btn, false);
    }
    if (!usedDownloads){
      if (isFramed()){
        showNotice('PDF-Export ist in dieser Vorschau leider nicht möglich.<br>Bitte die unabhängige Version dieser Seite verwenden (eigene Website oder Datei).');
      } else {
        window.print();
      }
    }
  }

  function personalText(list){
    var parts = (list||[]).filter(function(p){return p.name || p.stunden;}).map(function(p){
      return esc(p.name||'—') + (p.stunden ? ' ('+esc(p.stunden)+' Std)' : '');
    });
    return parts.length ? parts.join(', ') : '—';
  }
  function catQtyText(c, st){
    return c.qty.map(function(f){ return st.qty[f.k] ? (f.label+': '+esc(st.qty[f.k])) : ''; }).filter(Boolean).join(' · ') || '—';
  }
  function printHeaderHTML(title){
    return '<div class="phead"><h1>'+esc(title)+'</h1><div class="ph"><span class="swiss">swiss</span>bohr<div style="font-size:10px;font-weight:600;letter-spacing:.03em">Spezialtiefbau AG</div></div></div>';
  }
  function printTag(t, btn){
    var rows = CATS.map(function(c){
      var st = t.categories[c.key] || {qty:{}, personal:[]};
      return '<tr><td>'+esc(c.label)+'</td><td>'+catQtyText(c, st)+'</td><td>'+personalText(st.personal)+'</td></tr>';
    }).join('');
    var diverseRows = DIVERSE_OPTIONS.filter(function(o){ return t.diverses && t.diverses[o.key] && t.diverses[o.key].selected; }).map(function(o){
      var it = t.diverses[o.key];
      return '<tr><td>Diverses – '+esc(o.label)+'</td><td>'+(it.remark?esc(it.remark):'—')+'</td><td>'+personalText(it.personal)+'</td></tr>';
    }).join('');
    rows += diverseRows;
    var ap = t.material.ankerPfaehle.filter(function(r){return r.typ||r.l||r.stk;}).map(function(r){
      return esc(r.typ||'—')+' · L '+esc(r.l||'—')+' · Stk. '+esc(r.stk||'—');
    }).join('<br>') || '—';
    var html = printHeaderHTML('Tagesrapport') +
      '<div class="meta"><div><b>Auftraggeber:</b> '+esc(common.auftraggeber||'—')+'</div>'+
      '<div><b>Baustelle:</b> '+esc(common.baustelle||'—')+'</div>'+
      '<div><b>Datum:</b> '+esc(fmtDate(t.datum))+' &nbsp; <b>Wetter:</b> '+esc(t.wetter||'—')+'</div></div>'+
      '<div class="section">Aufgeführte Arbeiten</div>'+
      '<table><tr><th style="width:26%">Arbeit</th><th style="width:24%">Menge</th><th>Personal / Stunden</th></tr>'+rows+
      '<tr><td colspan="2"><b>Total Stunden</b></td><td><b>'+summarizeTag(t).toLocaleString('de-CH')+'</b></td></tr></table>'+
      '<div class="section">Material</div>'+
      '<table><tr><th style="width:26%">Anker/Pfähle</th><td>'+ap+'</td></tr>'+
      '<tr><th>Mörtel</th><td>'+esc(t.material.moertelTyp||'—')+' · '+esc(t.material.moertelKg||'—')+' kg</td></tr>'+
      '<tr><th>Netze</th><td>'+esc(t.material.netzeTyp||'—')+' · '+esc(t.material.netzeM2||'—')+' m²</td></tr>'+
      '<tr><th>Gunit</th><td>'+esc(t.material.gunitTyp||'—')+' · '+esc(t.material.gunitM3||'—')+' m³ lose</td></tr>'+
      '<tr><th>Zusätze</th><td>'+esc(t.material.zusaetzeTyp||'—')+' · '+esc(t.material.zusaetzeKgL||'—')+'</td></tr>'+
      '<tr><th>Diverses</th><td>'+esc(t.material.diversesMaterial||'—')+'</td></tr></table>'+
      '<div class="section">Fahrzeuge</div>'+
      '<table><tr><th>LKW Std</th><td>'+esc(t.fahrzeuge.lkwStd||'—')+'</td><th>PW km</th><td>'+esc(t.fahrzeuge.pwKm||'—')+'</td><th>Dieselbezug l</th><td>'+esc(t.fahrzeuge.dieselL||'—')+'</td></tr></table>'+
      '<div class="section">Bemerkungen</div>'+
      '<table><tr><td>'+esc(t.bemerkungen||'—')+'</td></tr></table>'+
      '<div style="margin-top:14px;font-size:11px">Unterschrift: '+esc(t.unterschrift||'—')+'</div>';
    finishExport(html, false, 'Tagesrapport_' + (t.datum||todayISO()), btn);
  }
  function printAnker(etappe, rows, btn){
    var head = '<tr><th>Datum</th><th>Wand</th><th>Lage</th><th>Nr.</th><th>Ankertyp</th><th>Länge total [m]</th><th>freie Länge [m]</th>'+
      '<th>Primär Zement [kg]</th><th>Primär Druck [bar]</th><th>Nachinj. Zement [kg]</th><th>Nachinj. Druck [bar]</th><th>Prüflast [kN]</th><th>Bemerkungen</th></tr>';
    var body = rows.map(function(r){
      return '<tr><td>'+esc(fmtDate(r.datum))+'</td><td>'+esc(r.wand)+'</td><td>'+esc(r.lage)+'</td><td>'+esc(r.nr)+'</td><td>'+esc(r.ankertyp)+'</td>'+
        '<td>'+esc(r.ankerlaenge)+'</td><td>'+esc(r.freieLaenge)+'</td><td>'+esc(r.primZement)+'</td><td>'+esc(r.primDruck)+'</td>'+
        '<td>'+esc(r.nachZement)+'</td><td>'+esc(r.nachDruck)+'</td><td>'+esc(r.pruflast)+'</td><td>'+esc(r.bemerkungen)+'</td></tr>';
    }).join('');
    var html = printHeaderHTML('Ankerprotokoll') +
      '<div class="meta"><div><b>Auftraggeber:</b> '+esc(common.auftraggeber||'—')+'</div>'+
      '<div><b>Baustelle:</b> '+esc(common.baustelle||'—')+' &nbsp; <b>Etappe:</b> '+esc(etappe||'—')+'</div></div>'+
      '<table>'+head+body+'</table>';
    finishExport(html, true, 'Ankerprotokoll_' + (etappe || todayISO()), btn);
  }
  document.getElementById('btnExportTag').addEventListener('click', function(e){ printTag(tag, e.currentTarget); });
  document.getElementById('btnExportAnker').addEventListener('click', function(e){ printAnker(anker.etappe, anker.rows, e.currentTarget); });

  /* ---------- init ---------- */
  function renderAll(){
    document.getElementById('tagDatum').value = tag.datum;
    document.getElementById('tagWetter').value = tag.wetter;
    document.getElementById('etappe').value = anker.etappe;
    document.getElementById('moertelTyp').value = tag.material.moertelTyp;
    document.getElementById('moertelKg').value = tag.material.moertelKg;
    document.getElementById('netzeTyp').value = tag.material.netzeTyp;
    document.getElementById('netzeM2b').value = tag.material.netzeM2;
    document.getElementById('gunitTyp').value = tag.material.gunitTyp;
    document.getElementById('gunitM3').value = tag.material.gunitM3;
    document.getElementById('zusaetzeTyp').value = tag.material.zusaetzeTyp;
    document.getElementById('zusaetzeKgL').value = tag.material.zusaetzeKgL;
    document.getElementById('diversesMaterial').value = tag.material.diversesMaterial;
    document.getElementById('lkwStd').value = tag.fahrzeuge.lkwStd;
    document.getElementById('pwKm').value = tag.fahrzeuge.pwKm;
    document.getElementById('dieselL').value = tag.fahrzeuge.dieselL;
    document.getElementById('bemerkungenTag').value = tag.bemerkungen;
    document.getElementById('unterschriftTag').value = tag.unterschrift;
    renderCats();
    renderAnkerPfaehle();
    renderAnkerRows();
    renderTagBanner();
  }
  renderAll();
})();
</script>
